<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Courier New', Courier, monospace; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes eq { 0%, 100% { transform: scaleY(0.25); } 25% { transform: scaleY(1); } 50% { transform: scaleY(0.45); } 75% { transform: scaleY(0.85); } }
      @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .in { animation: fadeIn 0.8s 0.2s both; }
      .eye { animation: pulse 3s ease-in-out infinite; }
      .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.2s ease-in-out infinite; }
      .fill { transform-box: fill-box; transform-origin: 0% 50%; animation: progress 60s linear infinite; }
      .b1 { animation-duration: 1.1s; animation-delay: -0.2s; }
      .b2 { animation-duration: 0.9s; animation-delay: -0.7s; }
      .b3 { animation-duration: 1.4s; animation-delay: -0.4s; }
      .b4 { animation-duration: 1.0s; animation-delay: -0.9s; }
      .b5 { animation-duration: 1.3s; animation-delay: -0.1s; }
      .b6 { animation-duration: 0.8s; animation-delay: -0.5s; }
      .b7 { animation-duration: 1.2s; animation-delay: -1.0s; }
      .b8 { animation-duration: 1.5s; animation-delay: -0.3s; }
      .b9 { animation-duration: 1.0s; animation-delay: -0.6s; }
      .b10 { animation-duration: 1.3s; animation-delay: -0.8s; }
      .b11 { animation-duration: 0.9s; animation-delay: -0.2s; }
      .b12 { animation-duration: 1.1s; animation-delay: -0.9s; }
    </style>
  </defs>

  <rect width="900" height="130" fill="#070B14"/>
  <rect x="30" y="10" width="840" height="110" rx="4" fill="#0A111D" stroke="#A9C7E8" stroke-width="1" stroke-opacity="0.45"/>
  <rect x="30" y="10" width="840" height="2" fill="#A9C7E8" opacity="0.5"/>

  <!-- cover art -->
  <clipPath id="cover"><rect x="50" y="26" width="78" height="78" rx="4"/></clipPath>
  <image href="data:image/jpeg;base64," x="50" y="26" width="78" height="78" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover)"/>
  <rect x="50" y="26" width="78" height="78" rx="4" fill="none" stroke="#A9C7E8" stroke-opacity="0.35"/>

  <circle class="eye" cx="152" cy="35" r="3" fill="#C8102E"/>
  <text class="in" x="162" y="39" font-size="10" letter-spacing="2" fill="#C8102E">ON REPEAT</text>
  <text class="in" x="150" y="64" font-size="18" font-weight="bold" fill="#E8F1FA">Only You</text>
  <text class="in" x="150" y="84" font-size="12" fill="#A9C7E8">Fern</text>

  <rect x="150" y="98" width="480" height="3" rx="1.5" fill="#1B3350"/>
  <rect class="fill" x="150" y="98" width="480" height="3" rx="1.5" fill="#A9C7E8"/>

  <text class="in" x="850" y="39" font-size="10" text-anchor="end" letter-spacing="1" fill="#6F8199">LISTEN ON SPOTIFY ▸</text>
  <g fill="#A9C7E8">
    <rect class="bar b1" x="730" y="52" width="5" height="46"/>
    <rect class="bar b2" x="740" y="52" width="5" height="46"/>
    <rect class="bar b3" x="750" y="52" width="5" height="46"/>
    <rect class="bar b4" x="760" y="52" width="5" height="46"/>
    <rect class="bar b5" x="770" y="52" width="5" height="46"/>
    <rect class="bar b6" x="780" y="52" width="5" height="46" fill="#C8102E"/>
    <rect class="bar b7" x="790" y="52" width="5" height="46"/>
    <rect class="bar b8" x="800" y="52" width="5" height="46"/>
    <rect class="bar b9" x="810" y="52" width="5" height="46"/>
    <rect class="bar b10" x="820" y="52" width="5" height="46"/>
    <rect class="bar b11" x="830" y="52" width="5" height="46"/>
    <rect class="bar b12" x="840" y="52" width="5" height="46"/>
  </g>
</svg>
