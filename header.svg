<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Courier New', Courier, monospace; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes drift { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.7; } }
      .l1 { animation: fadeIn 0.6s 0.2s both; }
      .l2 { animation: fadeIn 0.6s 0.9s both; }
      .l3 { animation: fadeIn 0.8s 1.6s both; }
      .l4 { animation: fadeIn 0.6s 2.3s both; }
      .l5 { animation: fadeIn 0.6s 2.9s both; }
      .l6 { animation: fadeIn 0.6s 3.5s both; }
      .l8 { animation: fadeIn 0.6s 4.8s both; }
      .l9 { animation: fadeIn 0.6s 5.5s both; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .eye { animation: pulse 3.5s ease-in-out infinite; }
      .field { animation: drift 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="280" fill="#070B14"/>

  <rect x="30" y="20" width="840" height="240" rx="4" fill="#0A111D"
        stroke="#A9C7E8" stroke-width="1" stroke-opacity="0.45"/>
  <rect x="30" y="20" width="840" height="2" fill="#A9C7E8" opacity="0.5"/>

  <!-- AT-field motif -->
  <g class="field" fill="none" stroke="#A9C7E8" stroke-width="1">
    <polygon points="770,80 830.6,115 830.6,185 770,220 709.4,185 709.4,115"/>
    <polygon points="770,105 809,127.5 809,172.5 770,195 731,172.5 731,127.5" stroke-opacity="0.6"/>
    <line x1="770" y1="80" x2="770" y2="105" stroke-opacity="0.4"/>
    <line x1="770" y1="195" x2="770" y2="220" stroke-opacity="0.4"/>
  </g>
  <circle class="eye" cx="770" cy="150" r="4.5" fill="#C8102E"/>
  <circle cx="770" cy="150" r="9" fill="none" stroke="#C8102E" stroke-width="0.8" stroke-opacity="0.5"/>

  <text class="l1" x="50" y="46" font-size="11" fill="#A9C7E8" opacity="0.55">MAGI TERMINAL · UNIT-00 PILOT RECORD</text>
  <text class="l1" x="778" y="46" font-size="11" fill="#C8102E" opacity="0.85">STANDBY</text>
  <line class="l1" x1="44" y1="52" x2="856" y2="52" stroke="#A9C7E8" stroke-width="0.5" stroke-opacity="0.3"/>

  <text class="l2" x="50" y="72" font-size="11" fill="#5C6B80">$  cat /nerv/pilots/active/tulang_t.profile</text>

  <text class="l3" x="50" y="97" font-size="22" font-weight="bold" letter-spacing="3" fill="#E8F1FA">TULANG, TIMOTHY JOHN</text>

  <text class="l4" x="50" y="116" font-size="11" fill="#A9C7E8" opacity="0.5">────────────────────────────────────────────────────────────────</text>

  <text class="l5" x="50" y="137" font-size="12" fill="#C8102E">DESIGNATION</text>
  <text class="l5" x="170" y="137" font-size="12" fill="#D5E3F2">3rd Year BS Computer Science · PLM Manila</text>

  <text class="l6" x="50" y="156" font-size="12" fill="#C8102E">GWA</text>
  <text class="l6" x="170" y="156" font-size="12" font-weight="bold" fill="#A9C7E8">1.19</text>
  <text class="l6" x="212" y="156" font-size="12" fill="#5C6B80">·  consistently top of program</text>

  <text class="l8" x="50" y="194" font-size="12" fill="#C8102E">STACK</text>
  <text class="l8" x="170" y="194" font-size="12" fill="#D5E3F2">Java · React · Supabase · TensorFlow · .NET</text>

  <text class="l9" x="50" y="215" font-size="11" fill="#A9C7E8" opacity="0.5">────────────────────────────────────────────────────────────────</text>

  <text class="l9" x="50" y="252" font-size="12" fill="#5C6B80">$  _</text>
  <text class="cursor" x="78" y="252" font-size="12" fill="#C8102E">█</text>
</svg>
