<svg width="900" height="40" viewBox="0 0 900 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes drift { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
      .eye { animation: pulse 3.5s ease-in-out infinite; }
      .hex { animation: drift 6s ease-in-out infinite; }
    </style>
    <linearGradient id="fadeL" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#A9C7E8" stop-opacity="0"/>
      <stop offset="1" stop-color="#A9C7E8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#A9C7E8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#A9C7E8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="19.5" width="370" height="1" fill="url(#fadeL)"/>
  <rect x="490" y="19.5" width="370" height="1" fill="url(#fadeR)"/>
  <g class="hex" fill="none" stroke="#A9C7E8" stroke-width="1">
    <polygon points="450,6 466.5,15.5 466.5,34.5 450,44 433.5,34.5 433.5,15.5" transform="translate(0,-5)"/>
    <polygon points="450,12 461,18 461,32 450,38 439,32 439,18" transform="translate(0,-5)" stroke-opacity="0.6"/>
  </g>
  <circle class="eye" cx="450" cy="20" r="2.5" fill="#C8102E"/>
</svg>
